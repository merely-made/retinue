[package]
name = "tulle-heltec-v4-phy"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

# The host link is a build-time choice, and the two are mutually exclusive.
#
# `host-usb` is the default and the development and recovery personality: the ESP32-S3's USB
# Serial/JTAG peripheral. Its clocks stop in Light-sleep and the host may fail to re-enumerate
# it on wake, so it cannot be the low-power build.
#
# `host-uart-low-power` speaks the same direct-PHY byte protocol over UART0 on the exposed
# header, which does survive Light-sleep and can wake the chip.
[features]
default = ["host-usb"]
host-usb = []
host-uart-low-power = []
ui-bench = []
rf-sleep-proof = []

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = { path = "../../vendor/embedded-graphics" }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }
esp-hal = { version = "1.1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = ["esp32s3", "no-op"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "esp32s3"] }
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
esp32s3 = "0.35.2"
embedded-storage = "0.3.1"
lora-modulation = "0.1.5"
lora-phy = { path = "../../vendor/lora-phy" }
radio-face = { path = "../../crates/radio-face" }
radio-hand = { path = "../../crates/radio-hand", features = ["radio"] }
selvage = { path = "../../crates/selvage" }
