[package]
rust-version = "1.97.1"
name = "tulle-heltec-v4-phy"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false

# The host link is a build-time choice, and the two are mutually exclusive.
#
# `host-usb` is the default and the development and recovery personality: the ESP32-S3's USB
# Serial/JTAG peripheral. Its clocks stop in Light-sleep and the host may fail to re-enumerate
# it on wake, so it cannot be the low-power build.
#
# `host-uart-low-power` speaks the same direct-PHY byte protocol over UART0 on the exposed
# header, which does survive Light-sleep and can wake the chip.
[features]
default = ["host-usb"]
# Only the literal USB Serial/JTAG image carries the normal-runtime signed control carrier,
# so only it links Retinue's allocation-free verifier through `radio-hand`. The modem image
# stays core-only: `control-retinue` deliberately does not enable `retinue/alloc`.
host-usb = ["radio-hand/control-retinue"]
host-uart-low-power = []
# The node build: the USB image as a standalone Reticulum transport node. Only it links the
# allocator (radio-hand's tracking heap over a fixed array), the shared node channel and
# Retinue's allocating core; without it the image builds exactly as the modem above, with no
# allocator and no `retinue/alloc`. `src/node.rs` refuses it beside `host-uart-low-power` or
# `rf-sleep-proof`. Build with `-Zbuild-std=core,alloc`.
node = ["host-usb", "radio-hand/node", "dep:retinue", "retinue/alloc"]
ui-bench = []
rf-sleep-proof = []

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = { path = "../../vendor/embedded-graphics" }
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.3", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "no-op"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3"] }
esp-storage = { version = "0.10.0", features = ["esp32s3"] }
esp32s3 = "0.36.0"
embedded-storage = "0.3.1"
heapless = "0.9"
hmac = "0.13"
lora-modulation = "0.1.5"
lora-phy = { path = "../../vendor/lora-phy" }
radio-face = { path = "../../crates/radio-face" }
radio-hand = { path = "../../crates/radio-hand", features = ["radio"] }
retinue = { path = "../../crates/retinue", default-features = false, optional = true }
selvage = { path = "../../crates/selvage" }
sha2 = { version = "0.11", default-features = false }
static_cell = "2.1.1"

[lints]
workspace = true
