schema = 2
package_id = "retinue.t114"
display_name = "Retinue for Heltec T114"
version = "0.0.1-v51"
publisher = "Merely Made"
regions = ["US915", "EU868", "EU433", "ANZ915", "JP920"]
channel_capabilities = ["modem", "node", "rnode"]
state_impact = "preserved"
license = "MPL-2.0"
notices = "See apps/linkboy/NOTICES.md; Retinue workspace notices and the repository MPL-2.0 license apply."
source_revision = "AIR3 bounded transport and non-starving native-node USB attach v51"
source_url = "https://github.com/merely-made/retinue/tree/main/firmware/t114-phy"
origin_url = "https://github.com/merely-made/retinue"

[[helpers]]
route = "uf2-mass-storage"
program = "linkboy UF2 volume writer"
version = "0.1.0"
license = "MPL-2.0"
source_url = "https://github.com/merely-made/retinue/tree/main/apps/linkboy"
notice = "This application-only route is built into Linkboy. It verifies every UF2 block, the nRF52840 family id, target addresses, and the whole-file digest before writing the owner-selected stock bootloader volume."

[payload]
path = "../t114-phy/tulle-t114-phy-v51.uf2"
format = "uf2"
byte_length = 550912
sha256 = "3b802471f5402f38cf4ab30c39d9acb9a9e893aaf2a588455536b57706452f1b"
write_bytes = 275456

[[targets]]
family = "t114"
revision = "2.x"
processor = "nrf52840"
flash_size = 1048576
bootloader = "adafruit-uf2-0.9.0"
route = "uf2-mass-storage"

[[write_ranges]]
start = 0x26000
length = 275456

[[preserved_ranges]]
start = 0xea000
length = 0x2000

[[preserved_ranges]]
start = 0xec000
length = 0x14000

[expected_application]
board = "t114"
version = "0.0.1"

[recovery]
before_write = "Double-tap reset to enter the stock HT-n5262 UF2 bootloader, select its mounted volume explicitly, and keep the cable attached. Linkboy refuses an existing same-named UF2 file rather than overwriting it."
after_failure = "Double-tap reset again, select the reappeared HT-n5262 volume, and retry this verified UF2 package. The S140 SoftDevice, bootloader, and persisted settings ranges remain outside the application write range."
