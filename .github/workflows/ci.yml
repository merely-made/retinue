name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Default rustfmt, enforced for consistency (no custom style).
      - name: Format
        run: cargo fmt --check

      # The default build is the tokio endpoint plus everything below it.
      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Test (default features)
        run: cargo test

      # The sans-io core (codec, framing, links, resources, channel/buffer, proofs)
      # must stand alone without the tokio runtime. Examples and endpoint tests are
      # gated by required-features, so this builds and tests only that core.
      - name: Test (retinue, no default features)
        run: cargo test -p retinue --no-default-features

      # The other host stacks have their own sans-io cores: sennet and tucket must
      # both stand without the `hardware` feature that pulls tulle's serial runtime.
      - name: Test (sennet and tucket, no default features)
        run: cargo test -p sennet -p tucket --no-default-features

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Docs (deny broken links)
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The published crates declare rust-version = "1.88", which is a promise to
  # anyone depending on them. Cargo records that number but never checks the code
  # actually builds on it, so an undefended MSRV drifts silently and downstream
  # gets a compile error instead of a clean "requires a newer rustc". This job is
  # the defence.
  #
  # It names the published host crates instead of running at the workspace root: the
  # firmware is a workspace member that reaches rustc 1.93 through `fixed`, so a
  # root-level run would fail on a crate the MSRV deliberately does not cover.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Build and test on the declared MSRV
        run: cargo test -p retinue -p tulle -p selvage -p sennet -p tucket -p outrider -p postilion -p signalman -p linkboy

  # The firmware members build for their own targets and are not default members, so
  # the host jobs above never compile them. This guards the flash-critical path: a
  # workspace-wide dependency bump that breaks the embedded build should fail here,
  # not on a bench with a cable in hand. The esp32s3 target (heltec-v4-phy) needs the
  # espup toolchain and stays a local build.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: Build (t114 phy)
        run: cargo build -p tulle-t114-phy --release --target thumbv7em-none-eabihf
      # Outrider's `no_std` codec, which is the LXMF that can reach a board. This is a
      # `build` and not a `test` on purpose: outrider dev-depends on postilion, which
      # depends back on outrider with default features, so `cargo test -p outrider
      # --no-default-features` quietly gets `std` again and proves nothing. A build for a
      # target with no `std` at all cannot be fooled that way, because dev-dependencies are
      # never built for it.
      - name: Build (outrider, no_std)
        run: cargo build -p outrider --no-default-features --target thumbv7em-none-eabihf

  # Enforce that the whole dependency tree stays permissively licensed. A copyleft
  # dependency would force any firmware that links retinue to GPLv3 (see deny.toml and the
  # embedded/licensing research note), so this gate fails the build if one ever enters.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # The registry's structural check: every validation asset belongs to a suite, no stale
  # selectors, no orphans. Cheap, and it is what stops a new capture script or fuzz corpus
  # entering the tree unaccounted for.
  validation-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the validation registry
        run: python3 validation/run.py verify
      - name: Audit unsafe policy
        run: python3 validation/security/unsafe_audit.py
      - name: Audit what a seized node yields
        run: |
          python3 validation/security/flash_classification.py --self-test
          python3 validation/security/flash_classification.py

  # Fuzzing runs here rather than on a developer's machine, and the reason is a finding
  # rather than a preference: cargo-fuzz cannot execute on Windows-MSVC without an ASan
  # runtime that the nightly toolchain does not ship, so both targets failed to launch and
  # the suite had never produced a single execution at any commit. Linux has the sanitizer
  # in-toolchain, so this is where the evidence can actually exist.
  #
  # Short budgets: this is a smoke gate proving the targets build, launch, and survive their
  # own seeds. Long campaigns belong to the scheduled tier, which owns real corpus growth.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove corpus isolation for every target
        run: |
          python3 validation/run_fuzz.py --dry-run --seconds 1 --target retinue-node-ingest
          python3 validation/run_fuzz.py --dry-run --seconds 1 --target outrider-lxmf-decode
          python3 validation/run_fuzz.py --dry-run --seconds 1 --target retinue-command-accept
      - name: Fuzz the node ingest path
        run: python3 validation/run_fuzz.py --seconds 120 --target retinue-node-ingest
      - name: Fuzz the board LXMF ingress
        run: python3 validation/run_fuzz.py --seconds 120 --target outrider-lxmf-decode
      - name: Fuzz the command authorization boundary
        run: python3 validation/run_fuzz.py --seconds 120 --target retinue-command-accept
      - name: Preserve any crash artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

# The RNS interoperability oracle (crates/retinue/oracle/) needs a Python venv and is
# not run here; the bytes it produced are checked in under crates/retinue/tests/fixtures/,
# so the gold tests that pin the wire run in CI against those fixtures with no Python.
# Sennet's Meshtastic capture tooling (crates/sennet/capture/) works the same way.
