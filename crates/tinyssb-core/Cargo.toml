[package]
name = "tinyssb-core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Allocation-free verifier for the pinned tinySSB v0 signed-feed wire format"
publish = false

[dependencies]
ed25519-dalek = { version = "3", default-features = false }
sha2 = { version = "0.11", default-features = false }
