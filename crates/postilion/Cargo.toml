[package]
name = "postilion"
version = "0.3.0"
edition = "2024"
rust-version.workspace = true
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "Shared radio-host library for the retinue family: the riding position inside the team."
keywords = ["radio", "mesh", "reticulum", "lora", "host"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
getrandom = "0.3"
heapless = "0.9"
outrider = { version = "0.3.0", path = "../outrider", features = ["tulle-radio"] }
retinue = { version = "0.3.0", path = "../retinue", features = ["tulle-radio"] }
serial2-tokio = "0.1.24"
selvage = { version = "0.1.0", path = "../selvage" }
seneschal = { version = "0.2.0", path = "../seneschal", features = ["retinue"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
tulle = { version = "0.1.0", path = "../tulle", features = ["serial-async"] }
