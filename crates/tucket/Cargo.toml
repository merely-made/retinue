[package]
name = "tucket"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
description = "MeshCore interop for the retinue radio family: node management, routing, and text interop over LoRa mesh."
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
readme = "README.md"
keywords = ["lora", "mesh", "meshcore", "radio", "reticulum"]
categories = ["network-programming", "embedded"]

[features]
default = []
hardware = ["dep:serial2-tokio", "dep:tokio", "dep:tulle"]

[dependencies]
aes = { version = "0.8", default-features = false }
curve25519-dalek = { version = "5", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
hmac = { version = "0.12", default-features = false }
serial2-tokio = { version = "0.1.24", optional = true }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "time"], optional = true }
tulle = { version = "0.1.0", path = "../tulle", features = ["serial-async"], optional = true }

[[example]]
name = "meshcore_headed"
required-features = ["hardware"]
