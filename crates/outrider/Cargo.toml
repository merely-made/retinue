[package]
name = "outrider"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "LXMF boundary crate in the retinue family: message codec, delivery, and propagation over Reticulum."
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
readme = "README.md"
keywords = ["lxmf", "reticulum", "mesh", "messaging"]
categories = ["network-programming"]

[features]
default = ["std"]
# Everything but the `no_std` codec needs a host: `rmpv`'s value tree, retinue's endpoint,
# its TCP interface. Turning this off leaves `portable`, which is what firmware takes.
std = [
    "dep:rmpv",
    "retinue/tokio",
    "retinue/compression",
    "thiserror/std",
]
# radio-face is a dev-dependency: only an example uses it, never the library.
tulle-radio = ["std", "retinue/tulle-radio", "dep:tulle"]
# Voice clips as message fields. Opt-in: a boundary crate should not carry a speech
# codec for consumers who only send text.
voice = ["std", "dep:pipit"]

[dependencies]
# Held level with retinue's hkdf/sha2/digest majors on purpose: a board that links both
# crates otherwise carries two SHA-256 implementations and two block buffers.
hkdf = "0.13"
# The clip format for voice messages. MIT/Apache, no_std, no dependencies of its own.
pipit = { version = "0.2", optional = true }
# No version until a retinue carrying this crate's required APIs is
# published; see design_docs/2026-08-13_outrider_publish_blocker.md.
retinue = { path = "../retinue", default-features = false }
rmpv = { version = "1.3.1", optional = true }
# sha2 0.11 has no std feature; its defaults are already no_std, so this line is the same
# on a host and on a board.
sha2 = "0.11"
thiserror = { version = "2", default-features = false }
tulle = { version = "0.0.2", path = "../tulle", features = ["serial-async"], optional = true }

[dev-dependencies]
# Used by the direct_phy_ui example only.
radio-face = { path = "../radio-face" }
# The park example now demonstrates the shared host library rather than reimplementing it.
# A dev-dependency, so outrider itself stays a boundary crate with no host machinery in it.
postilion = { version = "0.0.1", path = "../postilion" }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zeroize = "1"

[[example]]
name = "direct_phy_delivery"
required-features = ["tulle-radio"]

[[example]]
name = "direct_phy_opportunistic"
required-features = ["tulle-radio"]

[[example]]
name = "direct_phy_ui"
required-features = ["tulle-radio"]

[[example]]
name = "park"
required-features = ["tulle-radio"]
