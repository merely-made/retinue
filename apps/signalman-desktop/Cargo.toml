# Its own workspace root, excluded from retinue's. See the `exclude` note in the
# repository root manifest: genet's engine graph needs genet's `[patch]` table,
# and a patch does not inherit through a git dep, so pulling this into the main
# workspace would put the whole engine into every ordinary retinue build.
[workspace]

[package]
name = "signalman-desktop"
version = "0.0.1"
edition = "2024"
# Its own floor, not the workspace's. Retinue's `rust-version` is a promise
# about six published crates and their MSRV job; this package is private and
# rides genet, whose stack wants a newer toolchain than that promise allows.
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "Signalman's desktop face for the owner firmware flow, on the shared Cambium desktop host."
# Private, and deliberately so. Its host rides genet packages that inherit
# genet's `publish = false`, so this cannot be installed from crates.io no
# matter how it is versioned. Claiming otherwise before `cargo package` and a
# clean resolution prove it would be the packaging defect the scope names.
publish = false

[lib]
name = "signalman_desktop"
path = "src/lib.rs"

[[bin]]
name = "signalman-desktop"
path = "src/main.rs"

[dependencies]
# The presentation vocabulary. NOT linkboy: package trust, plans, execution,
# and recovery decisions stay behind Signalman, and this application renders
# plan facts rather than reconstituting them.
signalman = { version = "0.1.0", path = "../signalman" }
# Linkboy's own types appear in Signalman's projections (FlashEvent, FlashPlan,
# OwnerStage, the receipt), so the face names them to match on them. It never
# calls a policy, planning, or execution function directly — the worker invokes
# the owning Signalman/Linkboy flow, and nothing here can construct a FlashPlan.
linkboy = { version = "0.1.0", path = "../linkboy" }

# The single-root Cambium desktop host and its view toolkit, at an exact genet
# revision. A branch dep would make a Signalman build depend on whatever genet
# happened to have pushed; the exact rev is the reproducible private route the
# packaging decision calls for. Bump it deliberately, with a receipt.
cambium = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9", version = "=0.1.0" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9", version = "=0.1.0" }
sprigging = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
winit = "0.30"

# Signalman's management graph and its sealed station authority come from one
# exact Mere revision. Keep these on one source so identities and graph keys do
# not cross duplicate package instances.
mere-signalman = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
codicil = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
gaz = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
seiche = { git = "https://github.com/merely-made/mere.git", rev = "032683ae564ee6d27a1d6ab0d453f9e2ed3bd15e" }
euclid = "0.22"

[dev-dependencies]
# The accessibility receipt asserts against the projection the AccessKit
# adapter is handed, so it names AccessKit's own types.
accesskit = "0.24"

# Genet's graph needs the same patches its own workspace applies; a `[patch]`
# table does not inherit through a git dep. These are the two vendored forks
# plus the Stylo-rename adapter, taken from genet.git at the same revision.
[patch.crates-io]
stylo_taffy = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
taffy = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "d47a17bf65ceafada26e4c15c9afcce6c18c17f9" }

# mere-signalman names Retinue from an exact Git revision so its own manifest
# works in a clean Mere checkout. Redirect that source to this workspace: the
# desktop and the private port must exchange one Retinue/Postilion type family.
[patch."https://github.com/merely-made/retinue.git"]
postilion = { path = "../../crates/postilion" }
retinue = { path = "../../crates/retinue" }
