# Its own workspace root, excluded from retinue's. See the `exclude` note in the
# repository root manifest: genet's engine graph needs genet's `[patch]` table,
# and a patch does not inherit through a git dep, so pulling this into the main
# workspace would put the whole engine into every ordinary retinue build.
[workspace]

[package]
name = "signalman-desktop"
version = "0.0.1"
edition = "2024"
# Its own floor, not the workspace's. Retinue's `rust-version` is a promise
# about six published crates and their MSRV job; this package is private and
# rides genet, whose stack wants a newer toolchain than that promise allows.
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "Signalman's desktop face for the owner firmware flow, on the shared Cambium desktop host."
# Private, and deliberately so. Its host rides genet packages that inherit
# genet's `publish = false`, so this cannot be installed from crates.io no
# matter how it is versioned. Claiming otherwise before `cargo package` and a
# clean resolution prove it would be the packaging defect the scope names.
publish = false

[lib]
name = "signalman_desktop"
path = "src/lib.rs"

[[bin]]
name = "signalman-desktop"
path = "src/main.rs"

[dependencies]
# The presentation vocabulary. NOT linkboy: package trust, plans, execution,
# and recovery decisions stay behind Signalman, and this application renders
# plan facts rather than reconstituting them.
signalman = { version = "0.1.0", path = "../signalman" }
# Linkboy's own types appear in Signalman's projections (FlashEvent, FlashPlan,
# OwnerStage, the receipt), so the face names them to match on them. It never
# calls a policy, planning, or execution function directly — the worker invokes
# the owning Signalman/Linkboy flow, and nothing here can construct a FlashPlan.
linkboy = { version = "0.1.0", path = "../linkboy" }

# The single-root Cambium desktop host and its view toolkit, at an exact
# revision. A branch dep would make a Signalman build depend on whatever the
# owning repo happened to have pushed; the exact rev is the reproducible
# private route the packaging decision calls for. Bump it deliberately, with a
# receipt.
#
# **Cambium moved from genet to mere on 2026-09-03** (the platform boundary
# pass). `cambium`, `cambium-genet-winit-host` and `sprigging` are mere
# workspace members under `crates/cambium/` now; genet keeps only the name
# claims. So they take a mere.git revision, and the genet-side DOM seams below
# take the genet revision *that mere revision itself pins* — mere main pins
# genet at 115d348deddc344d949754e63beaece47cf49f34. One reference per git source: a second genet reference here
# would land two `LayoutDom`s and the host's would stop being the one this
# crate's views and receipts build against. Bump the genet rev when mere's
# moves, and only then.
cambium = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", version = "0.3.3" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", version = "0.1.0" }
sprigging = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", version = "0.2.1" }
genet-probe = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34", version = "=0.1.0" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34", version = "=0.1.0" }
winit = "0.30"
cpal = "=0.18.2"

# Signalman's management graph and its sealed station authority come from one
# exact Mere revision. Keep these on one source so identities and graph keys do
# not cross duplicate package instances.
mere-signalman = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
chartulary = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
gaz = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
muniment = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10", features = ["redb"] }
sceno = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
scenomise = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
seiche = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
euclid = "0.22"
pollster = "0.4"
thiserror = "2"

# The live station actor. Postilion supplies the snapshot type the projection
# consumes; personae/pandect supply the wallet and device id the lease-gated
# port requires. All Mere crates stay on the one pinned revision above.
postilion = { version = "0.1.0", path = "../../crates/postilion" }
personae = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
pandect = { git = "https://github.com/merely-made/mere.git", rev = "d82afa17e2cca86da843f07a2d718d2e69eb9f10" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
# The accessibility receipt asserts against the projection the AccessKit
# adapter is handed, so it names AccessKit's own types.
accesskit = "0.24"
tempfile = "3"
# The live bench receipt's announcing peer: a plain Postilion station with a
# short-lived random identity on the second attached board.
retinue = { version = "0.1.1", path = "../../crates/retinue" }
getrandom = "0.3"

# Genet's graph needs the same patches its own workspace applies; a `[patch]`
# table does not inherit through a git dep. These are the two vendored forks,
# taken from genet.git at the same revision (the Stylo-rename adapter retired
# with Stylo at genet 55c05d11).
[patch.crates-io]
# Upstream vello 0.10 still requires wgpu 29; genet unifies the stack on wgpu
# 30 through this fork (see genet's own [patch.crates-io] note). Pinned to the
# exact revision genet's lock resolves, so both graphs share one wgpu.
vello = { git = "https://github.com/mark-ik/vello.git", rev = "4354955e9d8637f32b7c78b20af2a58f842ba39e" }
# Genet renamed its vendored Taffy package to `genet-taffy` after the revision
# this workspace used to pin, so the patch must name the package explicitly
# while keeping the `taffy` dependency alias Cargo expects.
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
# genet-livery is built against Genet's Parley fork: its
# `AlignmentOptions::last_line_alignment` and `StyleProperty::TabSize` do not
# exist in published parley 0.10.0, which carries the same version number.
# Cambium's host reaches genet-livery, so this workspace must restate the
# patch mere and genet both carry — without it the fork's own source fails to
# compile against the registry crate.
parley = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }

# mere-signalman names the Retinue family from an exact Git revision so its
# manifest works in a clean Mere checkout. Redirect every directly named
# type-bearing member to this workspace: the desktop and private port must
# exchange one Retinue/Postilion/radio-hand family.
[patch."https://github.com/merely-made/retinue.git"]
# outrider joined the list 2026-09-02: mere-signalman now names it directly,
# and without the redirect two `outrider::codec::LxmfPayload`s land and
# `Station::send_payload` stops type-checking against the port.
outrider = { path = "../../crates/outrider" }
postilion = { path = "../../crates/postilion" }
retinue = { path = "../../crates/retinue" }
radio-hand = { path = "../../crates/radio-hand" }
