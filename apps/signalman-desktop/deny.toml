# cargo-deny configuration for apps/signalman-desktop, which is its own workspace.
# The rule and how a skip is argued are in the root deny.toml.

[bans]
multiple-versions = "deny"
wildcards = "allow"
skip = [
  { crate = "bitflags@1.3.2", reason = "png 0.17.16 requires it, via png 0.17.16 (latest) under mandrake (graphshell); goes when png moves to bitflags 2" },
  { crate = "downcast-rs@1.2.1", reason = "wayland-backend 0.3.17 requires it, via smithay-client-toolkit 0.21.1 and wayland-client 0.31.15 under winit-wayland 0.31.0-beta.4 (winit); goes when wayland-backend moves to downcast-rs 2" },
  { crate = "foldhash@0.1.5", reason = "hashbrown 0.15.5 requires it, via petgraph 0.8.3 (latest) under inker (inker), portolan (eidetic), seiche (seiche) and others; goes when hashbrown moves to foldhash 0.2" },
  { crate = "getrandom@0.2.17", reason = "ring 0.17.14 requires it; ring 0.17.14 (latest) under rustls 0.23 and rustls-webpki 0.103 via ureq 3.5 in linkboy holds it; goes when ring moves to getrandom 0.4 or the family ports ring" },
  { crate = "hash32@0.2.1", reason = "heapless 0.7.17 requires it, via postcard 1.1.3 (latest) under mandrake (graphshell), netrender (netrender), notochord (dramatis) and others; goes when heapless moves to hash32 0.3" },
  { crate = "hashbrown@0.15.5", reason = "petgraph 0.8.3 requires it, via petgraph 0.8.3 (latest) under inker (inker), portolan (eidetic), seiche (seiche) and others; goes when petgraph moves to hashbrown 0.17" },
  { crate = "hashbrown@0.16.1", reason = "gpu-allocator 0.28.0, regress 0.11.1, spade 2.15.1 require it, via hashbrown 0.16.1 under regress (genet); rapier2d 0.36.1 (latest) under seiche (seiche); wgpu 30.0.2 under cambium-desktop (graphshell), cambium-rootstock (graphshell), genet-presenter (genet) and others; goes when gpu-allocator, regress, spade move to hashbrown 0.17" },
  { crate = "heapless@0.7.17", reason = "postcard 1.1.3 requires it, via postcard 1.1.3 (latest) under mandrake (graphshell), netrender (netrender), notochord (dramatis) and others; goes when postcard moves to heapless 0.9" },
  { crate = "jni-sys@0.3.1", reason = "ndk 0.9.0, ndk-sys 0.6.0+11769913 require it, via cpal 0.18.2 (latest) under signalman-desktop; winit-android 0.31.0-beta.4 (winit) through android-activity 0.6.1; wgpu-hal 30.0.2 through ndk-sys; goes when ndk, ndk-sys move to jni-sys 0.4" },
  { crate = "libloading@0.8.9", reason = "ash 0.38.0+1.3.281 (latest), khronos-egl 6.0.0 (latest) and wgpu-hal 30.0.2 require it, via wgpu 30.0.2 under cambium-desktop (graphshell), cambium-rootstock (graphshell), genet-presenter (genet) and others; x11rb 0.14.0 (winit-x11 0.31.0-beta.4, cambium-desktop) takes 0.9.1; goes when ash, khronos-egl and wgpu-hal move to libloading 0.9.1" },
  { crate = "miniz_oxide@0.8.9", reason = "exr 1.74.3, png 0.17.16, png 0.18.1 require it, via image 0.25.10 (latest) under genet-livery (genet), mere-lanes (inker); png 0.17.16 (latest) under mandrake (graphshell); png 0.18.1 (latest) under netrender-vello (vello); goes when exr, png move to miniz_oxide 0.9" },
  { crate = "num-derive@0.4.2", reason = "cpal 0.18.2, rav1e 0.8.1 require it, via cpal 0.18.2 (latest) under signalman-desktop; image 0.25.10 (latest) under genet-livery (genet), mere-lanes (inker); goes when cpal, rav1e move to num-derive 0.5" },
  { crate = "objc2@0.5.3", reason = "accesskit_macos 0.27.2, objc2-app-kit 0.2.2, objc2-foundation 0.2.2 require it, via accesskit_macos 0.27.2 under genet-winit (genet); goes when accesskit_macos moves to objc2 0.6" },
  { crate = "objc2-app-kit@0.2.2", reason = "accesskit_macos 0.27.2 requires it, via accesskit_macos 0.27.2 under genet-winit (genet); goes when accesskit_macos moves to objc2-app-kit 0.3" },
  { crate = "objc2-foundation@0.2.2", reason = "accesskit_macos 0.27.2, objc2-app-kit 0.2.2 require it, via accesskit_macos 0.27.2 under genet-winit (genet); goes when accesskit_macos moves to objc2-foundation 0.3" },
  { crate = "png@0.17.16", reason = "mandrake 0.1.0 (graphshell) names png 0.17 directly; goes when mandrake moves to png 0.18" },
  { crate = "quick-xml@0.41.0", reason = "wayland-scanner 0.31.11 requires it, via smithay-client-toolkit 0.21.1 and wayland-client 0.31.15 under winit-wayland 0.31.0-beta.4 (winit); goes when wayland-scanner moves to quick-xml 0.42" },
  { crate = "redox_syscall@0.5.18", reason = "parking_lot_core 0.9.12 requires it, via html5ever 0.40.1 under genet-static-dom (genet); markup5ever 0.40.0 under genet-scripted-dom (genet), layout-dom-api (genet); wgpu 30.0.2 under cambium-desktop (graphshell), cambium-rootstock (graphshell), genet-presenter (genet) and others; goes when parking_lot_core moves to redox_syscall 0.9" },
  { crate = "syn@2.0.119", reason = "most proc-macros (arg_enum_proc_macro, curve25519-dalek-derive, enumflags2_derive, num-derive 0.4, pin-project-internal, thiserror-impl, tracing-attributes, zerocopy-derive and others) still require syn 2; goes as they move to syn 3" },
  { crate = "thiserror@1.0.69", reason = "ndk 0.9.0 requires it, via cpal 0.18.2 (latest) under signalman-desktop; winit-android 0.31.0-beta.4 (winit) through android-activity 0.6.1; goes when ndk moves to thiserror 2" },
  { crate = "thiserror-impl@1.0.69", reason = "thiserror 1.0.69 requires it, via cpal 0.18.2 (latest) under signalman-desktop; winit-android 0.31.0-beta.4 (winit); goes when thiserror moves to thiserror-impl 2" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17.14 requires it, via ring 0.17.14 (latest) under rustls 0.23.46 and rustls-webpki 0.103.17; goes when ring moves to windows-sys 0.61" },
]
