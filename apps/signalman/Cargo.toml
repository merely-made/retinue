[package]
name = "signalman"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "The radio-management application of the retinue family: the signal box for a household's radios."
keywords = ["radio", "mesh", "reticulum", "lora"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "signalman"
path = "src/main.rs"

[[bin]]
name = "signalman-first-owner"
path = "src/bin/signalman-first-owner.rs"

[[bin]]
name = "signalman-control-status"
path = "src/bin/signalman-control-status.rs"

[[bin]]
name = "signalman-control-verified"
path = "src/bin/signalman-control-verified.rs"

[[bin]]
name = "signalman-control-configure"
path = "src/bin/signalman-control-configure.rs"

[features]
# Read-only presentation over the existing message journal. No renderer or
# network adapter is enabled by the shared vocabulary.
comms = ["dep:comms"]

[dependencies]
# A scalar presentation vocabulary; does not exchange graph/identity types
# with the desktop's separately pinned Mere host packages.
comms = { package = "mere-comms", git = "https://github.com/merely-made/mere.git", rev = "ab067f1ea33e43cf97428616822d740de2561459", optional = true }
hex = "0.4"
linkboy = { version = "0.1.0", path = "../linkboy" }
outrider = { version = "0.1.1", path = "../../crates/outrider", features = ["voice"] }
pipit = "0.2"
postilion = { version = "0.1.0", path = "../../crates/postilion" }
quick-xml = "0.39.4"
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand" }
retinue = { version = "0.1.1", path = "../../crates/retinue", features = ["tulle-radio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }
tulle = { version = "0.1.0", path = "../../crates/tulle", features = ["serial-async"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
