[package]
name = "signalman"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "The radio-management application of the Murm family: the signal box for a household's radios."
keywords = ["radio", "mesh", "reticulum", "lora"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "signalman"
path = "src/main.rs"

[[bin]]
name = "signalman-first-owner"
path = "src/bin/signalman-first-owner.rs"

[[bin]]
name = "signalman-control-status"
path = "src/bin/signalman-control-status.rs"

[[bin]]
name = "signalman-control-verified"
path = "src/bin/signalman-control-verified.rs"

[[bin]]
name = "signalman-control-configure"
path = "src/bin/signalman-control-configure.rs"

[features]
portable-scenes = ["dep:sceno", "dep:sceno-backdrops"]
# Comms presentation and queue adapter over the application's message journal,
# carried by a stock companion radio that holds the keys. The companion frame types
# live in src/radio_comms/companion (formerly the sennet and tucket crates).
comms = ["dep:comms", "dep:async-trait", "dep:tempfile", "dep:getrandom", "dep:serial2-tokio"]

[dependencies]
tempfile = { version = "3", optional = true }
async-trait = { version = "0.1", optional = true }
serial2-tokio = { version = "0.1.24", optional = true }
# The shared presentation vocabulary lives in Murm, the peer repository.
comms = { package = "mere-comms", version = ">=0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main", optional = true }
hex = "0.4"
getrandom = { version = "0.4", optional = true }
linkboy = { version = "0.1.0", path = "../linkboy" }
outrider = { version = "0.3.0", path = "../../crates/outrider", features = ["voice"] }
pipit = { version = "0.2", path = "../../crates/pipit" }
postilion = { version = "0.3.0", path = "../../crates/postilion" }
quick-xml = "0.42"
radio-hand = { version = "0.0.1", path = "../../crates/radio-hand" }
retinue = { version = "0.3.0", path = "../../crates/retinue", features = ["tulle-radio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main", optional = true }
sceno-backdrops = { git = "https://github.com/merely-made/graphshell.git", branch = "main", optional = true }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }
tulle = { version = "0.2.0", path = "../../crates/tulle", features = ["serial-async"] }
zeroize = "1"

[[example]]
name = "radio_bridge"
path = "../../testing/mixed-propagation/radio_bridge.rs"

[[example]]
name = "stock_companion_pair"
required-features = ["comms"]

[[test]]
name = "structural_capture"
required-features = ["comms"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
serial2-tokio = "0.1.24"
selvage = { path = "../../crates/selvage" }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["termios"] }

[[bin]]
name = "signalman-survey-scene"
path = "src/bin/signalman-survey-scene.rs"
required-features = ["portable-scenes"]

[lints]
workspace = true
