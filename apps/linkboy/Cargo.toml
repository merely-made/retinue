[package]
name = "linkboy"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "Firmware and link-update tool for the retinue family: carries new firmware over the link, the way linkboys carried light."
keywords = ["radio", "firmware", "flashing", "dfu", "lora"]
categories = ["network-programming", "embedded"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "linkboy"
path = "src/main.rs"

[dependencies]
serial2 = "0.2.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2"
toml = "0.8"
