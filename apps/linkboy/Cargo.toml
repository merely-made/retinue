[package]
name = "linkboy"
version = "0.1.0"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/retinue"
description = "Firmware and link-update tool for the retinue family: carries new firmware over the link, the way linkboys carried light."
keywords = ["radio", "firmware", "flashing", "dfu", "lora"]
categories = ["network-programming", "embedded"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "linkboy"
path = "src/main.rs"

[dependencies]
minisign-verify = "0.2.5"
serial2 = "0.2.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2"
toml = "1"
# HTTPS fetch of qualified vendor releases (protocol_parity D5): the line graphshell's
# mere-fetch uses, rustls on ring with bundled webpki roots.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[lints]
workspace = true
